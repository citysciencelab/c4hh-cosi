# nginx server for the self-hosted COSI portal (BACKLOG §8).
#
# Serves the static build (dist/) and reverse-proxies routing to Valhalla so the
# portal calls it SAME-ORIGIN (/valhalla/...) — no CORS, no mixed-content, and a
# stable URL independent of where Valhalla actually runs.
#
# It also acts as a CACHING proxy for the two Hamburg upstreams the portal
# depends on (api.hamburg.de → /hh-api/, geodienste.hamburg.de → /geodienste/).
# Served configs are rewritten on the fly (sub_filter below) so ALL portal
# traffic to those hosts flows through here; `proxy_cache_use_stale` then keeps
# the portal usable from cache when Hamburg is down — e.g. mid-presentation.
# Warm the cache by clicking through the app once or via deploy/warm-hh-cache.py.
#
# Layout served from the web root (/usr/share/nginx/html):
#   /cosi/        → the COSI portal (index.html + config.js/json + registries)
#   /mastercode/  → versioned, immutable JS/CSS bundles
#   /auto /basic /master → stock Masterportal example portals (harmless extras)

# Disk cache for the Hamburg upstreams. `inactive=180d` means a cached response
# stays usable as a stale fallback for half a year after its last hit — eviction
# is by LRU (max_size), not by freshness. Mounted as a volume in docker-compose
# so the cache survives redeploys.
proxy_cache_path /var/cache/nginx/hh-upstreams levels=1:2 keys_zone=hh_upstreams:20m
                 max_size=2g inactive=180d use_temp_path=off;

# The portal runs behind a TLS-terminating reverse proxy (Plesk nginx) and speaks
# plain HTTP itself — for absolute URLs in rewritten configs, trust
# X-Forwarded-Proto when present.
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# What the BROWSER may keep of an upstream answer. The two proxy locations below
# forward Hamburg's own caching headers, and geodienste's WFS GetFeature answers
# say `max-age=86400` while carrying NEITHER ETag NOR Last-Modified. A browser
# that once stored a bad 200 for one of them (empty body, or a ServiceException
# served with status 200) is then stuck with it for a day and has no way to
# revalidate: that layer stays empty for that one person while the server hands
# out a perfect copy, and no redeploy can clear it — a private window "fixes" it,
# which is the tell. So where upstream gives us no validator, hand the browser a
# short-lived copy that has to come back to us; nginx's disk cache above answers
# that instantly, so this costs a request, not an upstream fetch.
#
# Tiles are exempt: they carry no validator either, but they are immutable in
# practice and capping them would re-fetch the whole basemap on every pan.
#
# NB the test reads what UPSTREAM sent, which is not always what the client gets:
# sub_filter drops Last-Modified/ETag from every response it rewrites (the body
# length may change), so the json types listed under sub_filter_types reach the
# browser without a validator regardless. That is harmless here — those answers
# carry `max-age=0` (style_v3.json) or no max-age at all (OAF) — but do not
# assume "has validator" means "the browser can revalidate".
map $upstream_http_etag$upstream_http_last_modified $upstream_has_validator {
    default 1;
    ""      0;
}
map $upstream_http_content_type $upstream_is_tile {
    default     0;
    "~*^image/" 1;
}
map $upstream_has_validator$upstream_is_tile $browser_cache_control {
    # revalidatable, or a tile → keep whatever upstream asked for
    default $upstream_http_cache_control;
    # unvalidatable data document → self-healing within minutes
    "00"    "max-age=120";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the Valhalla upstream per-request (via the
    # $valhalla_upstream variable below) lets nginx START even when Valhalla isn't
    # up yet — routing calls just 502 until it is, instead of nginx refusing to boot.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml application/manifest+json;

    # Land visitors on the COSI portal.
    location = / {
        return 302 /cosi/;
    }

    # Same-origin routing proxy: /valhalla/<path> → Valhalla container /<path>.
    # AccessibilityAnalysis posts to <restservice.url>/isochrone; with the rest
    # service url set to "/valhalla" (see the startup hook) that becomes
    # /valhalla/isochrone here, proxied to valhalla:8002/isochrone.
    location /valhalla/ {
        set $valhalla_upstream valhalla;
        rewrite ^/valhalla/(.*)$ /$1 break;
        proxy_pass http://$valhalla_upstream:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Isochrone requests are single-origin and can be slow; give them room.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # Versioned build assets: cache hard. This is only safe because the folder name
    # is unique per build (deploy/Dockerfile MASTERCODE_VERSION_FOLDER) — with a
    # PINNED name these urls are not content-addressed, and `immutable` then lets a
    # browser keep an old masterportal.js while lazily fetching a rebuilt chunk. The
    # chunks import minified export names that are regenerated every build, so in
    # such a mix half of them resolve to undefined and the app dies at startup.
    # One header, not `expires` + add_header (that emitted two Cache-Controls).
    location /mastercode/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # The portal shell points at one specific /mastercode/<build>/ — it must never
    # be served from cache, or a redeploy stays invisible until the browser decides
    # to revalidate on its own (nothing sets a lifetime here, so that is guesswork).
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Config + registries must reflect runtime injection on every container start,
    # so never cache them.
    #
    # On the way out, retarget the Hamburg upstreams at our caching proxy
    # locations below. ABSOLUTE URLs are required: masterportalapi builds layer
    # requests with `new URL(rawLayer.url)`, which throws on relative paths.
    # $http_host makes this work on any domain (localhost:8080, cosi.care4.…)
    # without knowing it in advance. featureNS never points at these hosts
    # (verified), so a plain string swap is safe.
    location ~* /(config\.js|config\.json|services\.json|rest-services\.json)$ {
        add_header Cache-Control "no-store";
        sub_filter_types application/json application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.hamburg.de/' '$public_scheme://$http_host/hh-api/';
        sub_filter 'https://geodienste.hamburg.de/' '$public_scheme://$http_host/geodienste/';
        try_files $uri =404;
    }

    # --- Hamburg upstream caches -------------------------------------------
    # Everything the (rewritten) configs point at flows through these two
    # locations. Responses are cached to disk; when the upstream errors or
    # times out, the last cached copy is served STALE instead — the portal
    # keeps working through Hamburg API outages (X-Cache-Status: STALE).
    # POSTs (mapfish print, WPS) pass through uncached, no worse than before.
    # `^~` keeps the config-rewrite regex location above from shadowing
    # upstream paths that happen to end in e.g. /services.json.

    location ^~ /hh-api/ {
        set $hh_api_upstream api.hamburg.de;
        rewrite ^/hh-api/(.*)$ /$1 break;
        proxy_pass https://$hh_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.hamburg.de;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.hamburg.de;
        # Plain-text upstream responses so sub_filter can rewrite OAF
        # pagination links ("next") — otherwise page 2+ bypasses the cache.
        # Our own gzip (above) still compresses on the way out.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json application/geo+json;
        sub_filter_once off;
        sub_filter 'https://api.hamburg.de/' '$public_scheme://$http_host/hh-api/';

        proxy_cache hh_upstreams;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 6h;
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504 http_429;
        # Without this, a request for an entry older than 6h REVALIDATES BLOCKING:
        # against a hanging api.hamburg.de the browser waits out proxy_read_timeout
        # for data we already have on disk (and any proxy in front — Plesk defaults
        # to 60s — 504s long before that). Serve the cached copy at once and refresh
        # in the background instead; that is what makes the cache outage-proof.
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        # A client (or a fronting proxy) giving up must not abort the upstream fetch:
        # letting it finish stores the response, so the retry is an instant HIT.
        proxy_ignore_client_abort on;
        add_header X-Cache-Status $upstream_cache_status always;
        # Replace upstream's caching policy with ours; see $browser_cache_control.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $browser_cache_control always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;

        # DNS-resolve failures (e.g. server fully offline) bypass
        # proxy_cache_use_stale — route those through the stale fallback too.
        error_page 502 504 = @hh_api_stale;
    }

    # Last-resort cache lookup for /hh-api/: proxy at a guaranteed-dead local
    # port; the instant connect error triggers use_stale, serving whatever the
    # cache has for this URI. Only truly uncached requests still 502.
    location @hh_api_stale {
        rewrite ^/hh-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1;
        sub_filter_types application/json application/geo+json;
        sub_filter_once off;
        sub_filter 'https://api.hamburg.de/' '$public_scheme://$http_host/hh-api/';
        proxy_cache hh_upstreams;
        proxy_cache_key $request_uri;
        proxy_cache_use_stale error timeout invalid_header
                              http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        # Replace upstream's caching policy with ours; see $browser_cache_control.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $browser_cache_control always;
    }

    location ^~ /geodienste/ {
        set $geodienste_upstream geodienste.hamburg.de;
        rewrite ^/geodienste/(.*)$ /$1 break;
        proxy_pass https://$geodienste_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host geodienste.hamburg.de;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name geodienste.hamburg.de;
        proxy_set_header Accept-Encoding "";
        # JSON here is style_v3.json / elastic search results — rewriting any
        # self-URLs keeps them on the proxy too; XML (WFS) needs no rewriting.
        sub_filter_types application/json application/geo+json;
        sub_filter_once off;
        sub_filter 'https://geodienste.hamburg.de/' '$public_scheme://$http_host/geodienste/';

        proxy_cache hh_upstreams;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 6h;
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504 http_429;
        # See /hh-api/ above.
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_ignore_client_abort on;
        add_header X-Cache-Status $upstream_cache_status always;
        # Replace upstream's caching policy with ours; see $browser_cache_control.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $browser_cache_control always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;

        error_page 502 504 = @geodienste_stale;
    }

    # See @hh_api_stale.
    location @geodienste_stale {
        rewrite ^/geodienste/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1;
        sub_filter_types application/json application/geo+json;
        sub_filter_once off;
        sub_filter 'https://geodienste.hamburg.de/' '$public_scheme://$http_host/geodienste/';
        proxy_cache hh_upstreams;
        proxy_cache_key $request_uri;
        proxy_cache_use_stale error timeout invalid_header
                              http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        # Replace upstream's caching policy with ours; see $browser_cache_control.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $browser_cache_control always;
    }

    # Portal shell + everything else. Masterportal keeps state in the query string
    # (no HTML5 path routing), so a plain directory/file lookup is the right fallback.
    location / {
        try_files $uri $uri/ =404;
    }
}
