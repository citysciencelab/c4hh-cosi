<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="title desc">
    <title id="title">Weekly OSV security scan flow</title>
    <desc id="desc">The pipeline installs dependencies, runs osv-scanner to produce osv-result.json in the repository root, then createJiraTicketFromOsv.mjs normalizes and deduplicates the findings, applies the CVSS threshold and classifies them against osvSuppressions.json. A Jira ticket is only created when new findings or expired suppressions exist.</desc>

    <!--
    Mermaid source, kept here so the diagram can be regenerated:

    flowchart TD
        A[npm install] --> B[osv-scanner scan -r .]
        B --> C[/osv-result.json at repo root/]
        C --> D[createJiraTicketFromOsv.mjs]
        E[/devtools/security/osvSuppressions.json/] --> D
        D --> F{New or Expired findings?}
        F -->|no| G[exit 0, no ticket]
        F -->|yes| H[POST to Jira]
    -->

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
        </marker>
    </defs>

    <style>
        .lbl { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #212121; }
        .h1 { font-size: 20px; font-weight: 600; }
        .h2 { font-size: 12px; fill: #616161; }
        .node { font-size: 14px; }
        .node-strong { font-size: 14px; font-weight: 600; }
        .small { font-size: 11px; fill: #546e7a; }
        .step { font-size: 12.5px; fill: #37474f; }
        .edge-lbl { font-size: 12px; font-weight: 600; fill: #37474f; }
        .flow { stroke: #37474f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
        .box-process { fill: #eceff1; stroke: #37474f; stroke-width: 1.4; }
        .box-group { fill: #f7f9fa; stroke: #37474f; stroke-width: 1.4; stroke-dasharray: 5 3; }
        .box-data { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.4; }
        .box-decision { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.4; }
        .box-stop { fill: #f5f5f5; stroke: #757575; stroke-width: 1.4; }
        .box-go { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.4; }
    </style>

    <rect x="0" y="0" width="760" height="830" fill="#ffffff"/>

    <text class="lbl h1" x="380" y="36" text-anchor="middle">Weekly OSV Security Scan</text>
    <text class="lbl h2" x="380" y="58" text-anchor="middle">bitbucket-pipelines.yml — custom pipeline "osv scan (security)"</text>

    <!-- npm install -->
    <rect class="box-process" x="270" y="82" width="220" height="46" rx="8"/>
    <text class="lbl node" x="380" y="111" text-anchor="middle">npm install</text>
    <path class="flow" d="M 380 128 L 380 160"/>

    <!-- osv-scanner -->
    <rect class="box-process" x="250" y="160" width="260" height="58" rx="8"/>
    <text class="lbl node" x="380" y="185" text-anchor="middle">osv-scanner scan -r .</text>
    <text class="lbl small" x="380" y="204" text-anchor="middle">--format json</text>
    <path class="flow" d="M 380 218 L 380 250"/>

    <!-- osv-result.json -->
    <polygon class="box-data" points="270,250 510,250 490,300 250,300"/>
    <text class="lbl node" x="380" y="272" text-anchor="middle">osv-result.json</text>
    <text class="lbl small" x="380" y="290" text-anchor="middle">repository root, read from the working directory</text>
    <path class="flow" d="M 380 300 L 380 334"/>

    <!-- script -->
    <rect class="box-group" x="190" y="334" width="380" height="172" rx="10"/>
    <text class="lbl node-strong" x="380" y="360" text-anchor="middle">createJiraTicketFromOsv.mjs</text>
    <text class="lbl step" x="212" y="392">1 · normalize and deduplicate findings</text>
    <text class="lbl step" x="212" y="416">2 · apply the CVSS threshold</text>
    <text class="lbl step" x="212" y="440">3 · classify against the suppression list</text>
    <text class="lbl step" x="212" y="464">4 · render the five report sections</text>
    <text class="lbl small" x="212" y="488">console output is produced either way</text>

    <!-- suppression list -->
    <polygon class="box-data" points="30,396 165,396 145,446 10,446"/>
    <text class="lbl step" x="87" y="418" text-anchor="middle">osvSuppressions.json</text>
    <text class="lbl small" x="87" y="435" text-anchor="middle">next to the script</text>
    <path class="flow" d="M 155 421 L 188 421"/>

    <path class="flow" d="M 380 506 L 380 542"/>

    <!-- decision -->
    <polygon class="box-decision" points="380,542 505,600 380,658 255,600"/>
    <text class="lbl node" x="380" y="596" text-anchor="middle">New or Expired</text>
    <text class="lbl node" x="380" y="614" text-anchor="middle">findings?</text>

    <!-- no branch -->
    <path class="flow" d="M 255 600 L 120 600 L 120 706"/>
    <text class="lbl edge-lbl" x="188" y="590" text-anchor="middle">no</text>
    <rect class="box-stop" x="20" y="706" width="200" height="52" rx="8"/>
    <text class="lbl node" x="120" y="729" text-anchor="middle">exit 0 — no ticket</text>
    <text class="lbl small" x="120" y="747" text-anchor="middle">everything already triaged</text>

    <!-- yes branch -->
    <path class="flow" d="M 505 600 L 640 600 L 640 706"/>
    <text class="lbl edge-lbl" x="572" y="590" text-anchor="middle">yes</text>
    <rect class="box-go" x="540" y="706" width="200" height="52" rx="8"/>
    <text class="lbl node" x="640" y="729" text-anchor="middle">POST to Jira</text>
    <text class="lbl small" x="640" y="747" text-anchor="middle">one ticket, five sections</text>

    <text class="lbl small" x="380" y="800" text-anchor="middle">Findings classified as Known, Suppressed or Stale never trigger a ticket on their own.</text>
</svg>
